<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>OneUI Add-ons</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="oneui-page">
    <header class="oneui-appbar">
      <div class="appbar-titles">
        <h1 class="appbar-title" data-i18n="appTitle">OneUI Add-ons</h1>
        <p class="appbar-sub" data-i18n="appSubtitle">XMSROM 9.5 &middot; GustyxPower</p>
      </div>
      <div class="appbar-actions">
        <button id="btn-lang" class="pill-lang" type="button" aria-label="Switch language">ID</button>
        <button id="btn-sync" class="round-btn" type="button" aria-label="Sync catalog">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
            <path d="M16 16h5v5" />
          </svg>
        </button>
        <button id="btn-logs" class="round-btn" type="button" aria-label="Mount diagnostics">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <polyline points="14 2 14 8 20 8" />
            <line x1="8" y1="13" x2="16" y2="13" />
            <line x1="8" y1="17" x2="13" y2="17" />
          </svg>
        </button>
        <button id="btn-settings" class="round-btn" type="button" aria-label="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </button>
      </div>
    </header>

    <p class="section-label" data-i18n="sysStatus">Status Sistem</p>
    <section class="oneui-card status-card" aria-label="System status">
      <div class="kv-row">
        <span class="kv-key" data-i18n="mountEngine">Mount Engine</span>
        <span id="stat-engine" class="kv-val accent">...</span>
      </div>
      <div class="kv-divider"></div>
      <div class="kv-row">
        <span class="kv-key" data-i18n="dataFree">Penyimpanan /data Tersedia</span>
        <span id="stat-data" class="kv-val">-</span>
      </div>
      <div class="kv-divider"></div>
      <div class="kv-row">
        <span class="kv-key" data-i18n="activeAddons">Add-on Terpasang</span>
        <span id="stat-installed" class="kv-val">-</span>
      </div>
    </section>

    <section id="job-banner" class="oneui-card job-card" hidden aria-live="polite">
      <div class="job-head">
        <span id="job-title" class="job-title">...</span>
        <span id="job-pct" class="job-pct">0%</span>
      </div>
      <div class="oneui-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="job-bar-wrap">
        <div id="job-fill" class="oneui-progress-fill"></div>
      </div>
      <p id="job-msg" class="job-msg"></p>
    </section>

    <div class="search-section">
      <div class="oneui-search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input id="search-input" type="search" placeholder="Cari Bixby, Routines, Edge..." aria-label="Search features" />
      </div>
      <div id="chips-row" class="oneui-chips" role="tablist" aria-label="Category filters"></div>
    </div>

    <div id="pack-sections" class="pack-sections" aria-label="OneUI packages"></div>
  </main>

  <div id="reboot-bar" class="oneui-bottom-bar" hidden>
    <div class="oneui-card bottom-card">
      <span class="bottom-msg" data-i18n="rebootPrompt">Reboot agar sistem memuat perubahan add-on.</span>
      <button id="btn-reboot" class="btn-oneui btn-blue" type="button" data-i18n="rebootBtn">Mulai Ulang</button>
    </div>
  </div>

  <dialog id="settings-modal" class="oneui-dialog" aria-labelledby="settings-title">
    <div class="dialog-head">
      <h2 id="settings-title" class="dialog-title" data-i18n="settingsTitle">Pengaturan Modul</h2>
      <button id="btn-close-settings" class="round-btn" type="button" aria-label="Close settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>
    <label class="dialog-label" for="select-lang" data-i18n="langLabel">Bahasa Antarmuka</label>
    <select id="select-lang" class="oneui-input">
      <option value="id">Bahasa Indonesia</option>
      <option value="en">English</option>
    </select>
    <label class="dialog-label" for="input-mirror" data-i18n="mirrorLabel">Mirror Base URL (.tar.xz)</label>
    <input id="input-mirror" class="oneui-input mono" type="url" placeholder="Default: Hugging Face (catalog.json)" />
    <label class="dialog-label" for="select-mode" data-i18n="modeLabel">Mode Mount</label>
    <select id="select-mode" class="oneui-input">
      <option value="auto" data-i18n="modeAuto">Otomatis (NoMount / Metamodule, else MagicMount)</option>
      <option value="magic" data-i18n="modeMagic">Magic Mount Bawaan (tmpfs + bind)</option>
      <option value="metamodule" data-i18n="modeMeta">Metamodule / NoMount Eksternal</option>
    </select>
    <div class="dialog-presets">
      <button id="btn-preset-hf" class="btn-oneui btn-tonal" type="button">Hugging Face</button>
      <button id="btn-preset-gh" class="btn-oneui btn-tonal" type="button">GitHub Releases</button>
    </div>
    <div class="dialog-actions">
      <button id="btn-cancel-settings" class="btn-oneui btn-ghost" type="button" data-i18n="cancelBtn">Batal</button>
      <button id="btn-save-settings" class="btn-oneui btn-blue" type="button" data-i18n="saveBtn">Simpan</button>
    </div>
  </dialog>

  <dialog id="logs-modal" class="oneui-dialog" aria-labelledby="logs-title">
    <div class="dialog-head">
      <h2 id="logs-title" class="dialog-title" data-i18n="logsTitle">Log Diagnostik Mount</h2>
      <button id="btn-close-logs" class="round-btn" type="button" aria-label="Close logs">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>
    <pre id="logs-box" class="oneui-log"></pre>
    <div class="dialog-actions">
      <button id="btn-ok-logs" class="btn-oneui btn-tonal" type="button" data-i18n="closeBtn">Tutup</button>
    </div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
